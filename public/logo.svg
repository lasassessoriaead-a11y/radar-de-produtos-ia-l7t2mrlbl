<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient (Diagonal Cyan #00F2FF to Purple #7000FF) -->
    <linearGradient id="radar-logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <!-- Cyan Glow Filter -->
    <filter id="radar-logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00F2FF" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Left Icon Mark (64x64 at x=8, y=8, rx=16) -->
  <g>
    <rect
      x="8"
      y="8"
      width="64"
      height="64"
      rx="16"
      fill="url(#radar-logo-gradient)"
      filter="url(#radar-logo-glow)"
    />

    <!-- Lucide Radar Icon inside 64x64 box (offset x=20, y=20, scale=1.66) -->
    <g transform="translate(20, 20) scale(1.66)" stroke="#0A0B10" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M19.07 4.93A10 10 0 0 0 4.93 19.07" />
      <path d="M16.24 7.76A6 6 0 0 0 7.76 16.24" />
      <path d="M13.41 10.59A2 2 0 0 0 10.59 13.41" />
      <path d="M12 12l7-7" />
    </g>
  </g>

  <!-- Typography: RADAR IA + INTELIGÊNCIA AFILIADOS -->
  <g transform="translate(86, 0)">
    <!-- Main Title -->
    <text
      x="0"
      y="43"
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
      font-weight="800"
      font-size="28"
      letter-spacing="-0.03em"
      fill="#FFFFFF"
    >
      RADAR <tspan fill="#00F2FF">IA</tspan>
    </text>

    <!-- Subtitle: INTELIGÊNCIA AFILIADOS -->
    <text
      x="1"
      y="60"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace"
      font-weight="600"
      font-size="9.5"
      letter-spacing="0.14em"
      fill="#9CA3AF"
    >
      INTELIGÊNCIA AFILIADOS
    </text>
  </g>
</svg>
